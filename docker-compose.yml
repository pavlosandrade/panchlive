services:
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4.2.2
    container_name: panchlive-lavalink
    restart: unless-stopped
    environment:
      - _JAVA_OPTIONS=-Xmx1G
      - SERVER_PORT=2333
      - LAVALINK_SERVER_PASSWORD=${LAVALINK_PASSWORD:-panchlive-lavalink-secret}
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
    ports:
      - "127.0.0.1:2333:2333"

  bot:
    build: .
    container_name: panchlive-bot
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - LAVALINK_HOST=lavalink
      - LAVALINK_PORT=2333
    depends_on:
      - lavalink

