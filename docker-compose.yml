services:
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4.2.2
    container_name: panchlive-lavalink
    restart: unless-stopped
    # Opcional: PLUGINS_YOUTUBE_OAUTH_REFRESHTOKEN (OAuth do YouTube). Nunca versionar.
    env_file:
      - path: .env.lavalink
        required: false
    environment:
      - _JAVA_OPTIONS=-Xmx1G
      - SERVER_PORT=2333
      - LAVALINK_SERVER_PASSWORD=${LAVALINK_PASSWORD:-panchlive-lavalink-secret}
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
    ports:
      - "127.0.0.1:2333:2333"

  bot:
    build: .
    container_name: panchlive-bot
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - LAVALINK_HOST=lavalink
      - LAVALINK_PORT=2333
      - PORT=3000
      - DATA_DIR=/app/data
      - TRUST_PROXY=${TRUST_PROXY:-true}
      - DASHBOARD_REQUIRE_HTTPS=${DASHBOARD_REQUIRE_HTTPS:-true}
    volumes:
      - bot-data:/app/data
    ports:
      - "127.0.0.1:${DASHBOARD_HOST_PORT:-3000}:3000"
    depends_on:
      - lavalink

volumes:
  bot-data:

