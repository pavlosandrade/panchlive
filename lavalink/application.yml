server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:2be8e542d3f6f178e048dca565892684c2e40177"
      snapshot: true
  server:
    password: "panchlive-lavalink-secret"
    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # OAuth: necessário quando o YouTube responde "Sign in to confirm you're not a bot"
    # ou "requires login" (comum em IPs de data center). Só funciona com o cliente TV.
    # O refresh token NÃO fica aqui (repositório público): é passado pela variável
    # PLUGINS_YOUTUBE_OAUTH_REFRESHTOKEN no arquivo .env.lavalink do servidor.
    # Use uma conta Google descartável: o YouTube pode encerrar contas usadas assim.
    oauth:
      enabled: true
    clients:
      - MUSIC
      - TV
      - ANDROID
      - IOS
      - ANDROID_VR
      - TVHTML5_SIMPLY
      - MWEB
      - WEB
      - WEBEMBEDDED

logging:
  file:
    path: ./logs/
  level:
    root: INFO
    lavalink: INFO
    dev.lavalink.youtube: INFO
